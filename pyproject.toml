# WARNING: This file is used only for development done on this addon.
# Be aware that dependencies used here might not match the ones used by
# the specific addon bundle set up on the AYON server. This file should
# be used only for local development and CI/CD purposes. To define addon
# dependencies, use pyproject.toml file in the `client` directory.

[project]
name = "ayon-beam"
version = "0.1.0"
description = "Prove of Concept for smart caching and entity-centric API for AYON"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9.6"
dependencies = [
    "ayon-python-api >= 1.0.0",
    "pre-commit",
    "ruff ~= 0.13",
    "mypy",
    "mkdocs-material ~= 9.6.7",
    "mkdocs-autoapi ~= 0.4.0",
    "mkdocstrings-python ~= 1.16.2",
    "mkdocs-minify-plugin ~= 0.8.0",
    "markdown-checklist ~= 0.4.4",
    "mdx-gh-links ~= 0.4",
    "pymdown-extensions ~= 10.14.3",
    "mike ~= 2.1.3",
    "mkdocstrings-shell ~= 1.0.2",
    "pymemcache ~= 4.0",
    "aiohttp>=3.8.0",
    "aiofiles>=24.1.0",
    "websockets>=11.0.0",
    "loguru ~= 0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "codespell",
    "pytest-ayon",
]

[tool.uv.sources]
pytest-ayon = { git = "https://github.com/ynput/pytest-ayon.git", branch = "develop" }

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = "-ra -q"

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "cli: CLI tests",
    "slow: Slow tests",
    "server: Tests that require a running AYON server",
]